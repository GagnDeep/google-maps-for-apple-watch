name: Wayfinder
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
options:
  deploymentTarget:
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Wayfinder:
    type: application
    platform: watchOS
    sources:
      - path: Wayfinder
    info:
      path: Wayfinder/Info.plist
      properties:
        CFBundleDisplayName: Wayfinder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        NSLocationWhenInUseUsageDescription: Wayfinder uses your location to show where you are, find places nearby and give turn-by-turn directions.
        NSLocationAlwaysAndWhenInUseUsageDescription: Wayfinder keeps guiding you with taps and voice while your wrist is down during navigation.
        UIBackgroundModes: [location, audio]
        CFBundleURLTypes:
          - CFBundleURLName: wayfinder
            CFBundleURLSchemes: [wayfinder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).wayfinder.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO
    dependencies:
      - target: WayfinderWidgets
  WayfinderWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WayfinderWidgets
    info:
      path: WayfinderWidgets/Info.plist
      properties:
        CFBundleDisplayName: Wayfinder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).wayfinder.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
schemes:
  Wayfinder:
    build:
      targets:
        Wayfinder: all
        WayfinderWidgets: all
    run:
      config: Debug
